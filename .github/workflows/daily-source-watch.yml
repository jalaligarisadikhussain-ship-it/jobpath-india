name: Daily government-recruitment source watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-source-watch.yml'
      - 'scripts/enrich_notice_pdfs.py'
      - 'scripts/discover_notice_leads.py'
      - 'scripts/publish_detected_notices.py'
  schedule:
    # UTC time. 02:15 UTC = 07:45 India Standard Time (IST).
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobpath-source-watch
  cancel-in-progress: false

jobs:
  review-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official source pages (never create job posts automatically)
        run: python3 scripts/daily_source_monitor.py
      - name: Install local PDF parser
        run: python3 -m pip install --disable-pip-version-check -r requirements-pdf.txt
      - name: Discover official notice links for human review only
        run: python3 scripts/discover_notice_leads.py
      - name: Extract bounded PDF evidence into manual review queue
        run: python3 scripts/enrich_notice_pdfs.py
      - name: Validate official-link review queue
        run: python3 scripts/validate_review_queue.py
      - name: Publish official source notice links as clearly unverified updates
        run: python3 scripts/publish_detected_notices.py
      - name: Build website before testing new public notice route
        run: python3 scripts/build_dist.py
      - name: Audit built website
        run: python3 tests/site_audit.py
      - name: Run project unit tests
        run: npm test
      - name: Validate verified-job records
        run: npm run validate
      - name: Test monitoring and review logic without network
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit review leads only when a source state changes
        shell: bash
        run: |
          git add data/source-watch-state.json reports/source-watch-latest.md data/notice-review-queue.json reports/notice-review-queue.md data/auto-notices.json
          if git diff --cached --quiet; then
            echo "No meaningful monitoring changes; no new deploy needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(notices): publish daily official-source notice leads"
          # Non-fast-forward pushes can happen when another editorial change lands
          # while slow government sites are being monitored. Rebase safely; never
          # overwrite another commit, and fail rather than force a conflict.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Monitoring report committed and pushed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push race on attempt $attempt; rebasing monitoring commit on current main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Review data conflict. Aborted without overwriting another commit." >&2
              exit 1
            fi
          done
          echo "Could not safely push monitoring updates after three retries." >&2
          exit 1
