name: Monitor code quality checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/daily_source_monitor.py'
      - 'scripts/discover_notice_leads.py'
      - 'scripts/enrich_notice_pdfs.py'
      - 'requirements-pdf.txt'
      - 'scripts/validate_review_queue.py'
      - 'scripts/publish_approved.py'
      - 'scripts/publish_detected_notices.py'
      - 'data/auto-notices.json'
      - 'data/pages.json'
      - 'assets/js/app.mjs'
      - 'scripts/build_final.py'
      - 'scripts/build_dist.py'
      - 'data/auto-publish-ledger.json'
      - '.github/workflows/auto-publish-approved-jobs.yml'
      - 'tests/**'
      - 'data/jobs.json'
      - 'data/notice-review-queue.json'
      - '.github/workflows/monitor-quality.yml'
      - '.github/workflows/daily-source-watch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/jobs.json'
      - 'data/notice-review-queue.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local PDF parser
        run: python3 -m pip install --disable-pip-version-check -r requirements-pdf.txt
      - name: Test monitoring and notice discovery offline
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate review queue and official link provenance
        run: python3 scripts/validate_review_queue.py
      - name: Simulate approved-only publisher without committing
        run: python3 scripts/publish_approved.py
      - name: Check dynamic website JavaScript syntax
        run: node --check assets/js/app.mjs
      - name: Build Netlify website output
        run: python3 scripts/build_dist.py
      - name: Audit site pages and SEO
        run: python3 tests/site_audit.py
      - name: Test site logic
        run: npm test
      - name: Validate recruitment data
        run: npm run validate
