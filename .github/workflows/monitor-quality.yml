name: Monitor code quality checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/daily_source_monitor.py'
      - 'tests/test_monitor_logic.py'
      - '.github/workflows/monitor-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test monitoring logic (no external requests)
        run: python3 -m unittest discover -s tests -p 'test_monitor*.py' -v
      - name: Test site logic
        run: npm test
      - name: Validate recruitment data
        run: npm run validate
