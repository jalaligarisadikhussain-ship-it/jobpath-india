name: JobPath source and SEO quality
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_final.py'
      - 'scripts/site_config.py'
      - 'data/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/source-quality.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recruitment source data
        run: node scripts/validate.mjs
      - name: Rebuild all static HTML with current deadlines
        run: python3 scripts/build_final.py
      - name: Check generated pages and internal links
        run: python3 tests/site_audit.py
      - name: Verify SEO origin and application-date freshness
        run: python3 -m unittest discover -s tests -p 'test_generated_site_quality.py' -v
      - name: Run regression tests
        run: node --test tests/*.test.mjs
