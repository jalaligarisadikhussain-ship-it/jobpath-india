<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | Deepavali Dhamaka</title><link rel="stylesheet" href="./styles.css"></head><body><div class="site-shell"><header class="nav"><a class="brand" href="./">✺ DEEPAVALI <b>DHAMAKA</b></a></header><main style="max-width:800px;margin:85px auto;min-height:55vh"><div class="section-eyebrow">GRAND DRAW</div><h1 style="font:800 48px Outfit,sans-serif">Deepavali Night Results</h1><p class="muted" id="msg">Official results will be available only after the organizer runs the draw at or after 8:00 PM IST on November 8, 2026. A preview site does not have winners.</p><div id="winners"></div><p><a href="./">← Back to spin wheel</a></p></main></div><script>fetch('/api/results',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.published)return;document.getElementById('msg').textContent='Official draw published. Winners are shown with partially masked codes.';const host=document.getElementById('winners');for(const p of d.winners){const e=document.createElement('p');e.className='glass-card';e.textContent=p.code+' — '+p.award;host.appendChild(e);}if(!d.winners.length)host.textContent='No eligible entries were awarded in this draw.'}).catch(()=>{});</script></body></html>
